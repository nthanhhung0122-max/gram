name: Auto Gramstone - Acc 1 (hungzai22)

on:
  workflow_dispatch:
  schedule:
    - cron: '10 */5 * * *'

concurrency:
  group: gram-acc1
  cancel-in-progress: true

jobs:
  run-gram-acc1:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama urllib3

      - name: Chay Auto Gramstone - Acc 1 (hungzai22)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          WORKFLOW_NAME: "gram_acc1.yml"
        run: |
          python auto_gramstone.py --acc 1
