name: Auto Gramstone Mining 24/7 (Acc 1 & Acc 2)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: gramstone-mining
  cancel-in-progress: true

jobs:
  run-mining:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama urllib3

      - name: Chay Auto Gramstone Combo 24/7
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python auto_gramstone_combo.py
