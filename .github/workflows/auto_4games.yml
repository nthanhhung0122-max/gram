name: Auto 4 Games Mining & Airdrop 24/7

on:
  schedule:
    # Chạy định kỳ mỗi 30 phút
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-4games-mining
  cancel-in-progress: true

jobs:
  run-4games:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests colorama urllib3

      - name: Run Auto 4 Games Master Runner
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION_ACC1 || secrets.TELEGRAM_STRING_SESSION }}
        run: |
          python auto_4games_master.py
